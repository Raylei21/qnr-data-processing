[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnr-data-processing"
version = "2.2.0"
description = "Configuration-driven questionnaire cleaning and tabulation engine"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
qnr-process = "qnr_data_processing.cli:main"

[tool.setuptools.packages.find]
include = ["qnr_data_processing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
