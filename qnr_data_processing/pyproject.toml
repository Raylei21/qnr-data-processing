[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "qnr-data-processing"
version = "1.0.0"
description = "通用问卷数据处理工具 — 自动解析问卷、清洗数据、定义标签、生成频数频率表"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.0",
    "openpyxl>=3.0",
    "numpy>=1.18",
]
